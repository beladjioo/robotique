[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "essaims"
version = "0.1.0"
description = "Branche essaims : consensus, formations, flocking, allocation de tâches par enchères."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
