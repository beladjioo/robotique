[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navigation"
version = "0.1.0"
description = "Branche navigation : robots mobiles, cartes d'occupation, A*, suivi de chemin."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "robocore"]

[tool.setuptools.packages.find]
where = ["src"]
