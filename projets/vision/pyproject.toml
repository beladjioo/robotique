[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision"
version = "0.1.0"
description = "Branche vision : modèle de caméra, géométrie multi-vues, homographies, triangulation."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "robocore"]

[tool.setuptools.packages.find]
where = ["src"]
