[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estimation"
version = "0.1.0"
description = "Branche estimation : localisation (EKF, filtre particulaire) et bases du SLAM."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "robocore"]

[tool.setuptools.packages.find]
where = ["src"]
