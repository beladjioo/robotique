[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planification"
version = "0.1.0"
description = "Branche planification : planification symbolique de tâches et interface en langage naturel."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
