[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apprentissage"
version = "0.1.0"
description = "Branche apprentissage : environnements style Gymnasium, Q-learning, CEM, randomisation de domaine."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
