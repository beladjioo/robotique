[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locomotion"
version = "0.1.0"
description = "Branche locomotion : marche bipède (LIPM, DCM), CPG quadrupèdes, cinématique de jambe."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "robocore"]

[tool.setuptools.packages.find]
where = ["src"]
