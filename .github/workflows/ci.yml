name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dépendances
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: make lint PYTHON=python
      - name: Tests
        run: make test-python PYTHON=python
      - name: Démos
        run: make demos PYTHON=python

  embarque:
    name: Embarqué C++ (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compilation et tests
        env:
          CXX: ${{ matrix.compiler }}
        run: make test-embarque
